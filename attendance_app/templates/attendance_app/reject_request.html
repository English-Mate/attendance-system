{% extends 'attendance_app/base.html' %}
{% block content %}
<div class="card" style="max-width: 450px;">
    <h2>Reject Request</h2>
    <p><strong>{{ request.full_name }}</strong></p>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        <div class="form-group">
            <label>Reason <span style="color: #c62828;">*</span></label>
            <textarea name="review_notes" rows="3" required placeholder="Why is this being rejected?"></textarea>
        </div>
        <button type="submit" class="btn btn-danger">Reject</button>
        <a href="{% url 'account_requests' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
