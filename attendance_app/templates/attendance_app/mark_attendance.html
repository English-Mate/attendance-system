{% extends 'attendance_app/base.html' %}
{% load attendance_tags %}
{% block content %}
<div class="header-row">
    <h1>Attendance - {{ class_section }}</h1>
</div>

<div class="card">
    <form method="get" style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem;">
            Date:
            <input type="date" name="date" value="{{ date }}" onchange="this.form.submit()">
        </label>
    </form>

    <form method="post">
        {% csrf_token %}
        <table>
            <thead>
                <tr><th>#</th><th>Student</th><th>Status</th><th>Notes</th></tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><strong>{{ student.username }}</strong></td>
                    <td>
                        <label style="margin-right: 1rem;">
                            <input type="radio" name="status_{{ student.id }}" value="present" {% if student.id not in attendance_map %}checked{% endif %}>
                            Present
                        </label>
                        <label>
                            <input type="radio" name="status_{{ student.id }}" value="absent" {% if student.id in attendance_map and attendance_map|dict_get:student.id == 'absent' %}checked{% endif %}>
                            Absent
                        </label>
                    </td>
                    <td><input type="text" name="notes_{{ student.id }}" style="width: 100%; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="Optional"></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div style="margin-top: 1rem;">
            <button type="submit" class="btn btn-success">Save Attendance</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
