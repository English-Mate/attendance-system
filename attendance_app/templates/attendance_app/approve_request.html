{% extends 'attendance_app/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px;">
    <h2>Approve Request</h2>
    <table style="margin-bottom: 1rem;">
        <tr><th>Name</th><td>{{ request.full_name }}</td></tr>
        <tr><th>Email</th><td>{{ request.email }}</td></tr>
        <tr><th>Username</th><td>{{ request.desired_username }}</td></tr>
        <tr><th>Role</th><td>{{ request.get_role_display }}</td></tr>
        <tr><th>Reason</th><td>{{ request.reason|default:"-" }}</td></tr>
    </table>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Review Notes (optional)</label>
            <textarea name="review_notes" rows="3" placeholder="Any notes about this approval..."></textarea>
        </div>
        <button type="submit" class="btn" style="background: #2e7d32;">Approve & Send Credentials</button>
        <a href="{% url 'account_requests' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
