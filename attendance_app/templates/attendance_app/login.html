{% extends 'attendance_app/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 5rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
            Want to be a teacher? <a href="{% url 'request_account' %}">Request access</a>
        </p>
    </div>
</div>
{% endblock %}
